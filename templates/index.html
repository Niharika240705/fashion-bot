<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE • Fashion Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Using playfair display for headings and lato for body for that luxury feel -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>LUXE</h1>
            <p>Your Personal High-Fashion Concierge</p>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">
                <p>Bonjour. I am Luxe. How may I assist you with your style today?</p>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask about trends, styling, or brands..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
